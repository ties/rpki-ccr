[package]
name = "rpki-ccr-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for rpki-ccr"
publish = false

[lib]
# The core crate's library is already called `rpki_ccr`; maturin renames the
# extension module to `rpki_ccr` (see pyproject.toml).
name = "rpki_ccr_py"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
rpki-ccr = { path = "../rpki-ccr", version = "0.1.0" }
pyo3.workspace = true
chrono.workspace = true
bytes.workspace = true
base64.workspace = true
num-bigint.workspace = true
