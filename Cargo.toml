[workspace]
resolver = "3"
members = ["crates/rpki-ccr", "crates/rpki-ccr-py"]
default-members = ["crates/rpki-ccr"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/ties/rpki-ccr"

[workspace.dependencies]
bcder = "0.7.7"
bytes = "1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
base64 = "0.22"
pyo3 = { version = "0.30", features = ["abi3-py39", "chrono", "num-bigint"] }
num-bigint = "0.4"
